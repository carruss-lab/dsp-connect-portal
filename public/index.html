<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSP Connect · Partner Portal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f3; }
      input, select, button, textarea { font-family: inherit; font-size: 13px; border: 0.5px solid #d1d0c8; border-radius: 8px; padding: 7px 10px; background: #fff; color: #1a1a18; outline: none; }
      input:focus, select:focus { border-color: #185FA5; }
      button { cursor: pointer; border-color: #c8c7bf; }
      button:hover { background: #f1efe8; }
      :root {
        --color-background-primary: #ffffff;
        --color-background-secondary: #f1efe8;
        --color-background-tertiary: #e8e6de;
        --color-text-primary: #1a1a18;
        --color-text-secondary: #5f5e5a;
        --color-border-tertiary: rgba(0,0,0,0.12);
        --color-border-secondary: rgba(0,0,0,0.22);
        --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', monospace;
        --border-radius-md: 8px;
        --border-radius-lg: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
