function calcEquity(p){
  const annual=p.annual_aum||0;
  if(annual<MIN_EQUITY_AUM)return{qualifies:false,base:0,a30:0,a60:0,a90:0,total:0};
  const a30=(DAY30.find(t=>(p.day30_aum||0)>=t.aum)||{award:0}).award;
  const a60=(DAY60.find(t=>(p.day60_aum||0)>=t.aum)||{award:0}).award;
  const a90=(DAY90.find(t=>(p.day90_aum||0)>=t.aum)||{award:0}).award;
  return{qualifies:true,base:5,a30,a60,a90,total:Math.min(5+a30+a60+a90,15)};
}
function calcScore(p,pipeline){
  let s=0;const aum=p.monthly_spend||0;
  if(aum>0)s+=20;if(aum>=100000)s+=15;if(aum>=250000)s+=15;
  const myPipe=pipeline.filter(c=>c.partner_id===p.id);
  s+=Math.min(myPipe.length*5,20);
  s+=Math.min(myPipe.filter(c=>c.stage==="Active").length*5,20);
  return Math.min(s,100);
}

function Login({onLogin}){
  const[email,setEmail]=useState("");const[pass,setPass]=useState("");const[err,setErr]=useState("");const[loading,setLoading]=useState(false);
  const attempt=async()=>{
    setErr("");setLoading(true);
    if(email.trim().toLowerCase()===ADMIN_CREDS.email&&pass===ADMIN_CREDS.password){setLoading(false);onLogin({role:"admin"});return;}
    const{data,error}=await sb.from("partners").select("*").eq("email",email.trim().toLowerCase()).eq("password",pass).single();
    setLoading(false);
    if(error||!data){setErr("Invalid email or password.");return;}
    onLogin({role:"partner",partner:data});
  };
  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:C.bg3}}>
    <div style={{width:400,background:C.bg,border:"0.5px solid "+C.border,borderRadius:16,padding:36}}>

      <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} placeholder="you@agency.com" style={{marginBottom:14}}/>
      <label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5}}>Password</label>
      <input value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&attempt()} type="password" placeholder="••••••••" style={{marginBottom:20}}/>
      {err&&<div style={{fontSize:12,color:C.red,background:C.redBg,borderRadius:8,padding:"8px 12px",marginBottom:14}}>{err}</div>}
      <button onClick={attempt} disabled={loading} style={{width:"100%",padding:10,fontSize:14,fontWeight:500,background:C.blue,color:"#fff",border:"none",borderRadius:8,cursor:"pointer"}}>{loading?"Signing in…":"Sign in"}</button>

function PartnerApp({partner,onLogout}){
  const[view,setView]=useState("dashboard");
  const[pipeline,setPipeline]=useState([]);
  const[resources,setResources]=useState([]);
  const[tickets,setTickets]=useState([]);
  const[loading,setLoading]=useState(true);
  const[showAddClient,setShowAddClient]=useState(false);
  const[clientType,setClientType]=useState("brand");
  const[newClient,setNewClient]=useState({name:"",contact_name:"",email:"",monthly_spend:"",notes:""});
  const[newTicket,setNewTicket]=useState({type:"Client Issue",subject:"",details:""});
  const[showTicket,setShowTicket]=useState(false);

  useEffect(()=>{
    Promise.all([
      sb.from("pipeline").select("*").eq("partner_id",partner.id),
      sb.from("resources").select("*").order("created_at",{ascending:false}),
      sb.from("tickets").select("*").eq("partner_id",partner.id).order("created_at",{ascending:false}),
    ]).then(([p,r,t])=>{setPipeline(p.data||[]);setResources(r.data||[]);setTickets(t.data||[]);setLoading(false);});
  },[partner.id]);

  const days=daysIn(partner.start_date);
  const monthly=(partner.monthly_spend||0)*REV_RATE;
  const equity=calcEquity(partner);
  const brandClients=pipeline.filter(c=>c.type==="brand");
  const agencyClients=pipeline.filter(c=>c.type==="agency");
  const score=calcScore(partner,pipeline);

  const addClient=async(type)=>{
    if(!newClient.name)return;
    const{data}=await sb.from("pipeline").insert([{type,partner_id:partner.id,partner_name:partner.name,...newClient,monthly_spend:parseFloat(newClient.monthly_spend)||0,stage:"Lead"}]).select().single();
    if(data)setPipeline(p=>[...p,data]);
    setNewClient({name:"",contact_name:"",email:"",monthly_spend:"",notes:""});setShowAddClient(false);
  };
  const moveStage=async(id,stage)=>{
    await sb.from("pipeline").update({stage}).eq("id",id);
    setPipeline(p=>p.map(c=>c.id===id?{...c,stage}:c));
  };
  const submitTicket=async()=>{
    if(!newTicket.subject)return;
    const{data}=await sb.from("tickets").insert([{partner_id:partner.id,partner_name:partner.name,...newTicket,status:"Open"}]).select().single();
    if(data)setTickets(t=>[data,...t]);
    setNewTicket({type:"Client Issue",subject:"",details:""});setShowTicket(false);
  };

      {view==="pipeline"&&<div>

                <div style={{minHeight:60,background:C.bg2,borderRadius:8,padding:6,display:"flex",flexDirection:"column",gap:6}}>

          <StatBox label="Brand revenue" value={fmtK(brandClients.filter(c=>c.stage==="Active").reduce((s,c)=>s+(c.monthly_spend||0),0))} icon="building" green/>
          <StatBox label="Agency revenue" value={fmtK(agencyClients.filter(c=>c.stage==="Active").reduce((s,c)=>s+(c.monthly_spend||0),0))} icon="briefcase" green/>
          <StatBox label="Revenue share (10%)" value={fmt$(monthly)} icon="currency-dollar" green/>
          <StatBox label="Annual run rate" value={fmtK(monthly*12)} icon="trending-up" green/>
        </div>
      </div>}

      {view==="equity"&&<div>
        <h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:500}}>Ownership center</h2>
        <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Equity Vesting, Performance & Acceleration Policy</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
          <StatBox label="Ownership %" value={equity.total.toFixed(2)+"%"} icon="chart-pie" blue/>
          <StatBox label="Vesting status" value={equity.qualifies?"Qualified":"Not yet"} sub={equity.qualifies?"$5M AUM met":"$5M AUM required"} icon="lock"/>
          <StatBox label="Next milestone" value={equity.qualifies?"Max achieved":fmtK(5000000-(partner.annual_aum||0))} sub={equity.qualifies?"":"to qualify"} icon="flag"/>
          <StatBox label="Equity value" value="Contact admin" icon="currency-dollar"/>
        </div>
        <Card style={{padding:16}}>
          <div style={{fontWeight:500,fontSize:14,marginBottom:16}}>Equity breakdown</div>
          {[{label:"Base grant (5%)",pct:equity.base,max:5,color:C.blue},{label:"Day 30 acceleration",pct:equity.a30,max:3,color:C.amber},{label:"Day 60 acceleration",pct:equity.a60,max:3,color:C.green},{label:"Day 90 acceleration",pct:equity.a90,max:4,color:C.purple}].map(r=><div key={r.label} style={{marginBottom:12}}>
            <div style={{display:"flex",justifyContent:"space-between",fontSize:12,marginBottom:4}}><span style={{color:C.muted}}>{r.label}</span><span style={{fontWeight:500}}>{equity.qualifies?r.pct.toFixed(2):0}%</span></div>
            <ProgressBar pct={equity.qualifies?(r.pct/r.max)*100:0} color={r.color}/>
          </div>)}
          <div style={{borderTop:"0.5px solid "+C.border,marginTop:12,paddingTop:12,display:"flex",justifyContent:"space-between",fontSize:14,fontWeight:500}}><span>Total</span><span style={{color:C.purple}}>{equity.total.toFixed(2)}% / 15.00%</span></div>
        </Card>
      </div>}

      {["training","sops","documents"].includes(view)&&<div>
        <h2 style={{margin:"0 0 20px",fontSize:18,fontWeight:500}}>{view==="training"?"Training":view==="sops"?"SOPs":"Documents"}</h2>
        {resources.filter(r=>r.category===view).length===0?<EmptyState icon="file-text" title="No resources yet" sub="Admin will upload materials here. Check back soon."/>
        :<div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:12}}>
          {resources.filter(r=>r.category===view).map(r=><Card key={r.id} style={{padding:14}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><i className={"ti ti-"+(r.type==="video"?"player-play":"file-text")} style={{fontSize:18,color:C.blue}}/>
            <div><div style={{fontWeight:500,fontSize:13}}>{r.title}</div><div style={{fontSize:11,color:C.muted}}>{r.type?.toUpperCase()} · {(r.created_at||"").slice(0,10)}</div></div></div>

      {view==="support"&&<div>

            <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Issue type</label><select value={newTicket.type} onChange={e=>setNewTicket(t=>({...t,type:e.target.value}))}>{["Client Issue","Agency Issue","Billing Issue","Technical Issue","Other"].map(t=><option key={t}>{t}</option>)}</select></div>
            <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Subject *</label><input value={newTicket.subject} onChange={e=>setNewTicket(t=>({...t,subject:e.target.value}))} placeholder="Brief description"/></div>
          </div>
          <div style={{marginBottom:10}}><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Details</label><input value={newTicket.details} onChange={e=>setNewTicket(t=>({...t,details:e.target.value}))} placeholder="Full description…"/></div>
          <div style={{display:"flex",gap:8}}><button onClick={submitTicket} style={{background:C.blue,color:"#fff",border:"none",borderRadius:8}}>Submit</button><button onClick={()=>setShowTicket(false)}>Cancel</button></div>
        </Card>}
        {tickets.length===0?<EmptyState icon="help-circle" title="No tickets yet" sub="Submit a ticket for any client, billing, or technical issue."/>
        :<Card style={{overflow:"hidden"}}>
          {tickets.map((t,i,arr)=><div key={t.id} style={{padding:"12px 16px",borderBottom:i<arr.length-1?"0.5px solid "+C.border:"none"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}><Pill label={t.type} bg={C.blueBg} fg={C.blue}/><span style={{fontWeight:500,fontSize:13,flex:1}}>{t.subject}</span><Pill label={t.status} bg={t.status==="Open"?C.amberBg:C.greenBg} fg={t.status==="Open"?C.amber:C.green}/><span style={{fontSize:12,color:C.muted}}>{(t.created_at||"").slice(0,10)}</span></div>
            {t.details&&<div style={{fontSize:12,color:C.muted,marginTop:4}}>{t.details}</div>}
          </div>)}
        </Card>}
      </div>}
    </div>
  </div>;
}

function AdminApp({onLogout}){
  const[partners,setPartners]=useState([]);
  const[pipeline,setPipeline]=useState([]);
  const[resources,setResources]=useState([]);
  const[tickets,setTickets]=useState([]);
  const[loading,setLoading]=useState(true);
  const[view,setView]=useState("dashboard");
  const[selected,setSelected]=useState(null);
  const[showAdd,setShowAdd]=useState(false);
  const[slackMsgs,setSlackMsgs]=useState([]);
  const[slackMsg,setSlackMsg]=useState("");
  const[slackCh,setSlackCh]=useState("#partner-revenue");
  const[newResource,setNewResource]=useState({title:"",type:"pdf",category:"training",description:""});
  const[showAddResource,setShowAddResource]=useState(false);
  const[saving,setSaving]=useState(false);
  const blank={name:"",legal_name:"",agency:"",email:"",password:"",vertical:VERTICALS[0],start_date:today(),monthly_spend:"",annual_aum:"",day30_aum:"",day60_aum:"",day90_aum:"",non_compete_days:"90",trailing_option:"A",status:"Pending Setup"};
  const[form,setForm]=useState(blank);const[formErr,setFormErr]=useState("");

  useEffect(()=>{
    Promise.all([
      sb.from("partners").select("*").order("created_at",{ascending:false}),
      sb.from("pipeline").select("*").order("created_at",{ascending:false}),
      sb.from("resources").select("*").order("created_at",{ascending:false}),
      sb.from("tickets").select("*").order("created_at",{ascending:false}),
    ]).then(([p,pi,r,t])=>{setPartners(p.data||[]);setPipeline(pi.data||[]);setResources(r.data||[]);setTickets(t.data||[]);setLoading(false);});
  },[]);

  const addPartner=async()=>{
    if(!form.name||!form.email||!form.password){setFormErr("Name, email, and password required.");return;}
    if(partners.find(p=>p.email.toLowerCase()===form.email.toLowerCase())){setFormErr("Email already exists.");return;}
    setSaving(true);
    const{data,error}=await sb.from("partners").insert([{...form,monthly_spend:parseFloat(form.monthly_spend)||0,annual_aum:parseFloat(form.annual_aum)||0,day30_aum:parseFloat(form.day30_aum)||0,day60_aum:parseFloat(form.day60_aum)||0,day90_aum:parseFloat(form.day90_aum)||0,non_compete_days:parseInt(form.non_compete_days)||90,onboarded:false}]).select().single();
    setSaving(false);
    if(error){setFormErr(error.message);return;}
    setPartners(p=>[data,...p]);setForm(blank);setShowAdd(false);setFormErr("");
  };
  const updatePartner=async(id,updates)=>{
    await sb.from("partners").update(updates).eq("id",id);
    setPartners(p=>p.map(x=>x.id===id?{...x,...updates}:x));
    if(selected?.id===id)setSelected(s=>({...s,...updates}));
  };
  const addResource=async()=>{
    if(!newResource.title)return;
    const{data}=await sb.from("resources").insert([newResource]).select().single();
    if(data)setResources(r=>[data,...r]);
    setNewResource({title:"",type:"pdf",category:"training",description:""});setShowAddResource(false);
  };
  const updateTicket=async(id,status)=>{
    await sb.from("tickets").update({status}).eq("id",id);
    setTickets(t=>t.map(x=>x.id===id?{...x,status}:x));
  };
  const movePipelineStage=async(id,stage)=>{
    await sb.from("pipeline").update({stage}).eq("id",id);
    setPipeline(p=>p.map(c=>c.id===id?{...c,stage}:c));
  };
  const sendSlack=(ch,msg)=>{const time=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});setSlackMsgs(p=>[{channel:ch,message:msg,time},...p]);};

  const totalAUM=partners.reduce((s,p)=>s+(p.monthly_spend||0),0);
  const totalComp=totalAUM*REV_RATE;
  const active=partners.filter(p=>p.status==="Active");
  const pendingApprovals=pipeline.filter(c=>c.stage==="Review");
  const navGroups=ADMIN_NAV.map(g=>({...g,items:g.items.map(i=>({...i,badge:i.key==="approvals"?pendingApprovals.length||null:null}))}));
  const header=<div><div style={{fontSize:11,color:C.muted,marginBottom:2}}>DSP Connect</div><div style={{fontWeight:500,fontSize:13}}>Admin Portal</div></div>;
  const footer=<button onClick={onLogout} style={{fontSize:12,color:C.muted,background:"none",border:"none",cursor:"pointer",display:"flex",alignItems:"center",gap:6,padding:0}}><i className="ti ti-logout" style={{fontSize:13}}/>Sign out</button>;
  const F=({label,children,full})=><div style={full?{gridColumn:"1/-1"}:{}}><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:5}}>{label}</label>{children}</div>;

  if(loading)return <div style={{display:"flex",minHeight:"100vh"}}><NavSidebar navGroups={navGroups} active={view} onSelect={setView} header={header} footer={footer}/><div style={{flex:1}}><Spinner/></div></div>;

  return <div style={{display:"flex",minHeight:"100vh",background:C.bg3}}>
    <NavSidebar navGroups={navGroups} active={view} onSelect={setView} header={header} footer={footer}/>
    <div style={{flex:1,overflowY:"auto",padding:24}}>

      {view==="dashboard"&&<div>
        <div style={{marginBottom:20}}><h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:500}}>Admin overview</h2><div style={{fontSize:12,color:C.muted}}>DSP Connect · Managing Partner program</div></div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:20}}>
          <StatBox label="Total partners" value={partners.length} sub={active.length+" active"} icon="users"/>
          <StatBox label="Total monthly AUM" value={fmtK(totalAUM)} icon="chart-bar"/>
          <StatBox label="Monthly comp due" value={fmt$(totalComp)} sub="10% of AUM" icon="currency-dollar" green/>
          <StatBox label="Pending review" value={pendingApprovals.length} sub="Client approvals" icon="clock"/>
        </div>
        {partners.length===0?<EmptyState icon="users" title="No managing partners yet" sub="Create your first managing partner to get started." cta="Add first partner →" onCta={()=>setView("admissions")}/>
        :<Card style={{overflow:"hidden"}}>
          <div style={{padding:"13px 16px",borderBottom:"0.5px solid "+C.border,fontWeight:500,fontSize:14}}>Partner snapshot</div>
          {partners.map((p,i)=>{const eq=calcEquity(p);return <div key={p.id} style={{display:"flex",alignItems:"center",gap:12,padding:"13px 16px",borderBottom:i<partners.length-1?"0.5px solid "+C.border:"none"}}>
            <Avatar name={p.name}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:13}}>{p.name}{p.agency?" · "+p.agency:""}</div><div style={{fontSize:11,color:C.muted}}>{p.vertical} · Day {daysIn(p.start_date)}</div></div>
            <StatusPill s={p.status}/>
            <div style={{textAlign:"right",minWidth:90}}><div style={{fontSize:13,fontWeight:500}}>{fmtK(p.monthly_spend||0)}</div><div style={{fontSize:11,color:C.muted}}>AUM/mo</div></div>
            <div style={{textAlign:"right",minWidth:75}}><div style={{fontSize:13,fontWeight:500,color:C.green}}>{fmt$((p.monthly_spend||0)*REV_RATE)}</div><div style={{fontSize:11,color:C.muted}}>comp/mo</div></div>
            <div style={{textAlign:"right",minWidth:55}}><div style={{fontSize:13,fontWeight:500,color:C.purple}}>{eq.total.toFixed(1)}%</div><div style={{fontSize:11,color:C.muted}}>equity</div></div>
          </div>;})}
        </Card>}
      </div>}

      {view==="admissions"&&<div>
        <SectionHead title="Partner admissions" action={<button onClick={()=>setShowAdd(s=>!s)} style={{background:showAdd?"transparent":C.blue,color:showAdd?C.text:"#fff",border:showAdd?"0.5px solid "+C.border:"none",borderRadius:8}}>{showAdd?"Cancel":"+ New partner"}</button>}/>
        {showAdd&&<Card style={{padding:20,marginBottom:20}}>
          <div style={{fontWeight:500,fontSize:14,marginBottom:16,paddingBottom:12,borderBottom:"0.5px solid "+C.border}}>New Managing Partner — Admission Notice</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
            <F label="Full legal name *"><input value={form.legal_name} onChange={e=>setForm(f=>({...f,legal_name:e.target.value}))}/></F>
            <F label="Display name *"><input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/></F>
            <F label="Agency / company"><input value={form.agency} onChange={e=>setForm(f=>({...f,agency:e.target.value}))}/></F>
            <F label="Email *"><input value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/></F>
            <F label="Portal password *"><input value={form.password} onChange={e=>setForm(f=>({...f,password:e.target.value}))}/></F>
            <F label="Start date"><input type="date" value={form.start_date} onChange={e=>setForm(f=>({...f,start_date:e.target.value}))}/></F>
            <F label="Vertical"><select value={form.vertical} onChange={e=>setForm(f=>({...f,vertical:e.target.value}))}>{VERTICALS.map(v=><option key={v}>{v}</option>)}</select></F>
            <F label="Non-compete (days)"><input type="number" value={form.non_compete_days} onChange={e=>setForm(f=>({...f,non_compete_days:e.target.value}))}/></F>
            <F label="Trailing compensation" full><select value={form.trailing_option} onChange={e=>setForm(f=>({...f,trailing_option:e.target.value}))}>{TRAILING_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}</select></F>
            <div style={{gridColumn:"1/-1",paddingTop:12,borderTop:"0.5px solid "+C.border}}>
              <div style={{fontSize:12,color:C.muted,marginBottom:10,fontWeight:500}}>AUM — can update later</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                <F label="Monthly spend ($)"><input type="number" value={form.monthly_spend} onChange={e=>setForm(f=>({...f,monthly_spend:e.target.value}))} placeholder="0"/></F>
                <F label="Annual AUM ($)"><input type="number" value={form.annual_aum} onChange={e=>setForm(f=>({...f,annual_aum:e.target.value}))} placeholder="0"/></F>
                <F label="Day 30 AUM ($)"><input type="number" value={form.day30_aum} onChange={e=>setForm(f=>({...f,day30_aum:e.target.value}))} placeholder="0"/></F>
                <F label="Day 60 AUM ($)"><input type="number" value={form.day60_aum} onChange={e=>setForm(f=>({...f,day60_aum:e.target.value}))} placeholder="0"/></F>
                <F label="Day 90 AUM ($)"><input type="number" value={form.day90_aum} onChange={e=>setForm(f=>({...f,day90_aum:e.target.value}))} placeholder="0"/></F>
              </div>
            </div>
          </div>
          {formErr&&<div style={{marginTop:10,fontSize:12,color:C.red,background:C.redBg,padding:"8px 12px",borderRadius:8}}>{formErr}</div>}
          <div style={{display:"flex",gap:10,marginTop:14}}>
            <button onClick={addPartner} disabled={saving} style={{background:C.blue,color:"#fff",border:"none",borderRadius:8}}>{saving?"Saving…":"Create partner account"}</button>
            <button onClick={()=>{setShowAdd(false);setForm(blank);setFormErr("");}}>Cancel</button>
          </div>
        </Card>}
        {partners.length===0&&!showAdd&&<EmptyState icon="user-plus" title="No partners yet" sub='Click "+ New partner" to create the first managing partner.'/>}
        {partners.filter(p=>p.status==="Pending Setup").length>0&&<div style={{marginBottom:16}}>
          <div style={{fontSize:12,fontWeight:500,color:C.muted,marginBottom:10}}>Pending setup</div>
          {partners.filter(p=>p.status==="Pending Setup").map(p=><Card key={p.id} style={{padding:14,marginBottom:10}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}><Avatar name={p.name}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:13}}>{p.name}</div><div style={{fontSize:11,color:C.muted}}>{p.email}</div></div><StatusPill s={p.status}/>
            <button onClick={()=>updatePartner(p.id,{status:"Active"})} style={{fontSize:12,padding:"6px 12px",background:C.greenBg,color:C.green,border:"0.5px solid #C0DD97",borderRadius:8}}>Activate</button></div>
          </Card>)}
        </div>}
      </div>}

      {view==="partner-mgmt"&&<div>
        <h2 style={{margin:"0 0 20px",fontSize:18,fontWeight:500}}>Partner management</h2>
        {partners.length===0?<EmptyState icon="users" title="No partners" sub="Add partners from Admissions." cta="Go to admissions" onCta={()=>setView("admissions")}/>
        :partners.map(p=>{const eq=calcEquity(p);const open=selected?.id===p.id;
          return <Card key={p.id} style={{marginBottom:12,overflow:"hidden"}}>
            <div onClick={()=>setSelected(open?null:p)} style={{display:"flex",alignItems:"center",gap:12,padding:"14px 16px",cursor:"pointer",background:open?C.bg2:"transparent"}}>
              <Avatar name={p.name} size={42}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:14}}>{p.name}{p.agency?" · "+p.agency:""}</div><div style={{fontSize:12,color:C.muted}}>{p.email} · {p.vertical}</div></div>
              <StatusPill s={p.status}/><Pill label={eq.total.toFixed(1)+"% equity"} bg={C.purpleBg} fg={C.purple}/>
              <div style={{textAlign:"right",minWidth:90}}><div style={{fontSize:14,fontWeight:500}}>{fmtK(p.monthly_spend||0)}</div><div style={{fontSize:11,color:C.muted}}>AUM/mo</div></div>
              <div style={{textAlign:"right",minWidth:80}}><div style={{fontSize:14,fontWeight:500,color:C.green}}>{fmt$((p.monthly_spend||0)*REV_RATE)}</div><div style={{fontSize:11,color:C.muted}}>comp/mo</div></div>
            </div>
            {open&&<div style={{padding:16,borderTop:"0.5px solid "+C.border,background:C.bg2}}>
              <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:14}}>
                {[{label:"Monthly AUM ($)",f:"monthly_spend"},{label:"Annual AUM ($)",f:"annual_aum"},{label:"Day 30 AUM ($)",f:"day30_aum"},{label:"Day 60 AUM ($)",f:"day60_aum"},{label:"Day 90 AUM ($)",f:"day90_aum"}].map(({label,f})=><div key={f}><label style={{fontSize:11,color:C.muted,display:"block",marginBottom:4}}>{label}</label><input type="number" defaultValue={p[f]||0} onBlur={e=>updatePartner(p.id,{[f]:parseFloat(e.target.value)||0})} style={{fontSize:13}}/></div>)}
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <select value={p.status} onChange={e=>updatePartner(p.id,{status:e.target.value})} style={{fontSize:12,padding:"6px 10px",borderRadius:8,border:"0.5px solid "+C.border,background:C.bg}}>{["Pending Setup","Onboarding","Active","Inactive"].map(s=><option key={s}>{s}</option>)}</select>
              </div>
            </div>}
          </Card>;
        })}
      </div>}

      {(view==="admin-brands"||view==="admin-agencies")&&<div>
        <h2 style={{margin:"0 0 20px",fontSize:18,fontWeight:500}}>{view==="admin-brands"?"All brand clients":"All agency clients"}</h2>
        {pipeline.filter(c=>c.type===(view==="admin-brands"?"brand":"agency")).length===0?<EmptyState icon="building" title="No clients yet" sub="Partners will add clients from their dashboard."/>
        :<Card style={{overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",padding:"10px 16px",background:C.bg2,borderBottom:"0.5px solid "+C.border,fontSize:11,fontWeight:500,color:C.muted}}><span>Name</span><span>Spend</span><span>Stage</span><span>Partner</span><span>Added</span></div>
          {pipeline.filter(c=>c.type===(view==="admin-brands"?"brand":"agency")).map((c,i,arr)=><div key={c.id} style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr 1fr 1fr",padding:"12px 16px",borderBottom:i<arr.length-1?"0.5px solid "+C.border:"none",alignItems:"center"}}>
            <div><div style={{fontWeight:500,fontSize:13}}>{c.name}</div><div style={{fontSize:11,color:C.muted}}>{c.contact_name}</div></div>
            <div style={{fontSize:13,fontWeight:500,color:C.green}}>{fmtK(c.monthly_spend||0)}</div>
            <select value={c.stage} onChange={e=>movePipelineStage(c.id,e.target.value)} style={{fontSize:11,padding:"2px 6px",borderRadius:4,border:"0.5px solid "+C.border,background:C.bg}}>{PIPELINE_STAGES.map(s=><option key={s}>{s}</option>)}</select>
            <div style={{fontSize:12,color:C.muted}}>{c.partner_name}</div>
            <div style={{fontSize:12,color:C.muted}}>{(c.created_at||"").slice(0,10)}</div>
          </div>)}
        </Card>}
      </div>}

      {view==="approvals"&&<div>
        <h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:500}}>Client approvals</h2>
        <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Clients in Review stage — pending approval</div>
        {pendingApprovals.length===0?<EmptyState icon="check-circle" title="No pending approvals" sub="Clients in Review stage will appear here."/>
        :pendingApprovals.map(c=><Card key={c.id} style={{padding:14,marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <Pill label={c.type==="brand"?"Brand":"Agency"} bg={C.blueBg} fg={C.blue}/>
            <div style={{flex:1}}><div style={{fontWeight:500,fontSize:13}}>{c.name}</div><div style={{fontSize:11,color:C.muted}}>Partner: {c.partner_name} · {fmtK(c.monthly_spend||0)}/mo</div></div>
            <button onClick={()=>movePipelineStage(c.id,"Approved")} style={{fontSize:12,padding:"6px 12px",background:C.greenBg,color:C.green,border:"0.5px solid #C0DD97",borderRadius:8}}>Approve</button>
            <button onClick={()=>movePipelineStage(c.id,"Lead")} style={{fontSize:12,padding:"6px 12px",background:C.redBg,color:C.red,border:"0.5px solid #F7C1C1",borderRadius:8}}>Reject</button>
          </div>
        </Card>)}
      </div>}

      {view==="comp-tracking"&&<div>
        <h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:500}}>Compensation tracking</h2>
        <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Ad Revenue Under Management · 10% rev share</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}}>
          <StatBox label="Total monthly AUM" value={fmtK(totalAUM)} icon="chart-bar"/>
          <StatBox label="Monthly comp due" value={fmt$(totalComp)} icon="currency-dollar" green/>
          <StatBox label="Annual run rate" value={fmtK(totalComp*12)} icon="trending-up" green/>
        </div>
        {partners.map(p=><Card key={p.id} style={{marginBottom:12,overflow:"hidden"}}>
          <div style={{padding:"12px 16px",borderBottom:"0.5px solid "+C.border,display:"flex",alignItems:"center",gap:12}}>
            <Avatar name={p.name} size={36}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:13}}>{p.name}</div><div style={{fontSize:11,color:C.muted}}>{p.vertical}</div></div>
            <StatusPill s={p.status}/><div style={{fontSize:13,fontWeight:500,color:C.green}}>10% · {fmt$((p.monthly_spend||0)*REV_RATE)}/mo</div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)"}}>
            {[{l:"Monthly AUM",v:fmtK(p.monthly_spend||0)},{l:"Annual AUM",v:fmtK(p.annual_aum||0)},{l:"Monthly comp",v:fmt$((p.monthly_spend||0)*REV_RATE),green:true},{l:"Annual comp",v:fmtK((p.annual_aum||0)*REV_RATE),green:true}].map((m,i)=><div key={m.l} style={{padding:"10px 16px",borderRight:i<3?"0.5px solid "+C.border:"none"}}><div style={{fontSize:11,color:C.muted,marginBottom:3}}>{m.l}</div><div style={{fontSize:15,fontWeight:500,color:m.green?C.green:C.text}}>{m.v}</div></div>)}
          </div>
        </Card>)}
      </div>}

      {view==="stripe"&&<div>
        <h2 style={{margin:"0 0 4px",fontSize:18,fontWeight:500}}>Stripe payouts</h2>
        <div style={{fontSize:12,color:C.muted,marginBottom:20}}>Disbursements from DSP Connect Stripe · Partners do not connect their own Stripe</div>
        <div style={{background:C.greenBg,border:"0.5px solid #C0DD97",borderRadius:10,padding:"10px 16px",marginBottom:20,fontSize:13,color:C.green,display:"flex",alignItems:"center",gap:10}}>
          <i className="ti ti-check-circle" style={{fontSize:16}}/>DSP Connect Stripe account · All payouts flow from your account only
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}}>
          <StatBox label="Next payout batch" value={fmt$(totalComp)} sub="All active partners" icon="send" green/>
          <StatBox label="Active partners" value={active.length} icon="users"/>
          <StatBox label="Payout rate" value="10% AUM" icon="percentage"/>
        </div>
        {active.map(p=><Card key={p.id} style={{marginBottom:10,padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
          <Avatar name={p.name} size={36}/><div style={{flex:1}}><div style={{fontWeight:500,fontSize:13}}>{p.name}</div><div style={{fontSize:11,color:C.muted}}>{p.email}</div></div>
          <div style={{fontSize:13,fontWeight:500,color:C.green}}>10% · {fmt$((p.monthly_spend||0)*REV_RATE)}/mo</div>
          <div style={{fontSize:12,color:C.muted}}>{fmtK(p.monthly_spend||0)} AUM</div>
        </Card>)}
      </div>}

      {view==="content-mgmt"&&<div>
        <SectionHead title="Content management" action={<button onClick={()=>setShowAddResource(s=>!s)} style={{background:showAddResource?"transparent":C.blue,color:showAddResource?C.text:"#fff",border:showAddResource?"0.5px solid "+C.border:"none",borderRadius:8}}>{showAddResource?"Cancel":"+ Add resource"}</button>}/>
        {showAddResource&&<Card style={{padding:16,marginBottom:16}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:10}}>
            <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Title *</label><input value={newResource.title} onChange={e=>setNewResource(r=>({...r,title:e.target.value}))}/></div>
            <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Type</label><select value={newResource.type} onChange={e=>setNewResource(r=>({...r,type:e.target.value}))}>{["pdf","video","pptx","docx","article"].map(t=><option key={t}>{t}</option>)}</select></div>
            <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Category</label><select value={newResource.category} onChange={e=>setNewResource(r=>({...r,category:e.target.value}))}>{["training","sops","documents"].map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label style={{fontSize:12,color:C.muted,display:"block",marginBottom:4}}>Description</label><input value={newResource.description} onChange={e=>setNewResource(r=>({...r,description:e.target.value}))}/></div>
          </div>
          <div style={{display:"flex",gap:8}}><button onClick={addResource} style={{background:C.blue,color:"#fff",border:"none",borderRadius:8}}>Add resource</button><button onClick={()=>setShowAddResource(false)}>Cancel</button></div>
        </Card>}
        {["training","sops","documents"].map(cat=><div key={cat} style={{marginBottom:20}}>
          <div style={{fontWeight:500,fontSize:13,color:C.muted,marginBottom:8,textTransform:"capitalize"}}>{cat} ({resources.filter(r=>r.category===cat).length})</div>
          {resources.filter(r=>r.category===cat).length===0?<div style={{fontSize:13,color:C.muted}}>None yet.</div>
          :resources.filter(r=>r.category===cat).map(r=><Card key={r.id} style={{padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",gap:10}}>
            <i className={"ti ti-"+(r.type==="video"?"player-play":"file-text")} style={{fontSize:18,color:C.blue}}/>
            <div style={{flex:1}}><div style={{fontWeight:500,fontSize:13}}>{r.title}</div><div style={{fontSize:11,color:C.muted}}>{r.type?.toUpperCase()} · {r.description}</div></div>
          </Card>)}
        </div>)}
      </div>}

      {view==="slack"&&<div>
        <h2 style={{margin:"0 0 20px",fontSize:18,fontWeight:500}}>Slack</h2>
        <Card style={{padding:20,marginBottom:14}}>
          <div style={{fontWeight:500,fontSize:13,marginBottom:12}}>Message log</div>
          <div style={{background:C.bg2,borderRadius:10,padding:12,maxHeight:240,overflowY:"auto",display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
            {slackMsgs.length===0&&<div style={{color:C.muted,fontSize:13,textAlign:"center",padding:"2rem 0"}}>No notifications yet.</div>}
            {slackMsgs.map((m,i)=><div key={i} style={{background:C.bg,borderRadius:8,padding:"10px 12px",border:"0.5px solid "+C.border}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:11,fontWeight:500,color:C.blue}}>{m.channel}</span><span style={{fontSize:11,color:C.muted}}>{m.time}</span></div>
              <div style={{fontSize:13}}>{m.message}</div>
            </div>)}
          </div>
          <div style={{display:"flex",gap:8}}>
            <select value={slackCh} onChange={e=>setSlackCh(e.target.value)} style={{fontSize:12,padding:"6px 10px",borderRadius:8,border:"0.5px solid "+C.border,background:C.bg}}><option>#partner-revenue</option><option>#partner-payouts</option><option>#partner-updates</option></select>
            <input value={slackMsg} onChange={e=>setSlackMsg(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"&&slackMsg.trim()){sendSlack(slackCh,slackMsg);setSlackMsg("");}}} placeholder="Send message…" style={{flex:1}}/>
            <button onClick={()=>{if(slackMsg.trim()){sendSlack(slackCh,slackMsg);setSlackMsg("");}}} style={{padding:"6px 14px"}}>Send</button>
          </div>
        </Card>
      </div>}

    </div>
  </div>;
}

function App(){
  const[session,setSession]=useState(null);
  const handleLogin=async s=>{
    if(s.role==="partner"){
      const{data}=await sb.from("partners").select("*").eq("id",s.partner.id).single();
      setSession({...s,partner:data||s.partner});
    }else setSession(s);
  };
  const completeOnboarding=async()=>{
    await sb.from("partners").update({onboarded:true,status:"Active"}).eq("id",session.partner.id);
    setSession(s=>({...s,partner:{...s.partner,onboarded:true,status:"Active"}}));
  };
  if(!session)return <Login onLogin={handleLogin}/>;
  if(session.role==="admin")return <AdminApp onLogout={()=>setSession(null)}/>;
  if(!session.partner.onboarded)return <Onboarding partner={session.partner} onComplete={completeOnboarding}/>;
  return <PartnerApp partner={session.partner} onLogout={()=>setSession(null)}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
